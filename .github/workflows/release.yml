name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleRelease

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_assets
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          [ "$TAG_NAME" = "refs/heads/main" ] && TAG_NAME="nightly"
          
          # Copy release APK with clean name
          cp app/build/outputs/apk/release/app-release.apk release_assets/GhostMode-${TAG_NAME}.apk
          
          # Generate SHA256 Checksums
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cd ..
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: Ghost Mode ${{ steps.prepare_artifacts.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
