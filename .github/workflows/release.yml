name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Check version matches tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Anchored patterns: the comment above versionCode must not match.
          VERSION_NAME=$(sed -n 's/^ *versionName = "\([^"]*\)" *$/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\) *$/\1/p' app/build.gradle.kts)
          if [ "v${VERSION_NAME}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match versionName ${VERSION_NAME}"
            exit 1
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      # Publishing an APK signed with a debug key would break updates for every user.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > ghostmode-release.keystore

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ghostmode-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signer.txt
          grep -qi "fb2ae9c480bb0f045565f7b5cabf017d981821a933f07853dd471228d571b050" signer.txt

      - name: Prepare assets and notes
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GhostMode-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

          python3 .github/scripts/release_notes.py \
            "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" \
            "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: Ghost Mode ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
