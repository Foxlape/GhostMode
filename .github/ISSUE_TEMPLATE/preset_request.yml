name: Preset for a device
description: Share commands that work (or a device where nothing works yet)
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Presets are shell commands run through Shizuku or root. Placeholders:
        `-s 0` → selected SIM slot, `{{SAVED_MASK}}` → network mask saved before turning on,
        `{{IMS_PACKAGES}}` → IMS services used by the selected SIMs.
        You can export a custom preset from the app (Presets → ⋮ → Export) and attach the JSON file.

  - type: input
    id: device
    attributes:
      label: Device and firmware
      placeholder: "Honor Magic6 Pro, MagicOS 8 (Android 14)"
    validations:
      required: true

  - type: input
    id: carrier
    attributes:
      label: Carrier and country
      placeholder: "Beeline, Russia"

  - type: textarea
    id: on_commands
    attributes:
      label: Turn-on commands
      render: shell
      placeholder: |
        cmd phone ims disable -s 0
        cmd phone set-allowed-network-types-for-users -s 0 01000001000000000000
    validations:
      required: true

  - type: textarea
    id: off_commands
    attributes:
      label: Turn-off commands
      render: shell
      placeholder: |
        cmd phone set-allowed-network-types-for-users -s 0 {{SAVED_MASK}}
        cmd phone ims enable -s 0
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Test results
      description: Did callers hear "subscriber unavailable"? Did mobile data keep working? Did VoLTE come back after turning off?
    validations:
      required: true
