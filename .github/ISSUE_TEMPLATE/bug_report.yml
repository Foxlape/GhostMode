name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Before you start: open **Settings → Diagnostics** in Ghost Mode, then
        **Command log → Copy log** — the log is the most useful part of a report.

  - type: input
    id: app_version
    attributes:
      label: Ghost Mode version
      description: Settings → About
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and firmware
      placeholder: "Pixel 8, Android 15 / Galaxy S24 Ultra, One UI 7"
    validations:
      required: true

  - type: input
    id: carrier
    attributes:
      label: Carrier and country
      description: IMS behaviour depends on the carrier. Mention if you use two SIM cards.
      placeholder: "MTS, Russia · dual SIM"

  - type: dropdown
    id: backend
    attributes:
      label: Access method
      options:
        - Shizuku
        - Sui
        - KernelSU
        - Magisk
        - APatch
        - Other
    validations:
      required: true

  - type: dropdown
    id: preset
    attributes:
      label: Preset
      options:
        - Universal
        - Stock Android / Pixel
        - Xiaomi HyperOS / MIUI
        - Samsung One UI
        - OnePlus / OxygenOS
        - vivo / iQOO
        - Android 9–11
        - Custom preset
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        1. Turned Ghost Mode on
        2. Called from another phone
        3. The call rang through instead of "subscriber unavailable"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: What the Diagnostics screen shows (network types, IMS service, mobile data).

  - type: textarea
    id: log
    attributes:
      label: Command log
      description: Settings → Command log → copy. It contains shell commands and their output only.
      render: shell
